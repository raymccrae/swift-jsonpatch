name: Linux Foundation diagnostics
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp Scripts/linux-probe.swift /tmp/main.swift
          swiftc Sources/JSONPatch/*.swift /tmp/main.swift -o /tmp/probe
          /tmp/probe
        shell: bash
